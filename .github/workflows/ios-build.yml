name: Build iOS IPA

on:
  push:
    branches:
      - devops/CI-CD-release
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Flutter Pub Get
        run: flutter pub get

      ##########################################################
      # Install Signing Certificate
      ##########################################################

      - name: Install Certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12

          # Create and configure keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          # Import certificate with codesign trust
          security import certificate.p12 \
            -k build.keychain \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -A

          # Allow codesign to access without UI prompt (CRITICAL FIX: added codesign:)
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -k "$KEYCHAIN_PASSWORD" \
            build.keychain

          # Set as default and add to search list
          security default-keychain -s build.keychain
          security list-keychains -d user -s build.keychain login.keychain

      - name: Verify Certificate
        run: |
          echo "==== Code Signing Identities ===="
          security find-identity -v -p codesigning

      ##########################################################
      # Install Provisioning Profile
      ##########################################################

      - name: Install Provisioning Profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Verify Provisioning Profile
        run: |
          PROFILE=$(find ~/Library/MobileDevice/Provisioning\ Profiles -name "*.mobileprovision" | head -n 1)
          echo "Profile: $PROFILE"
          security cms -D -i "$PROFILE" > profile.plist
          echo "Name: $(/usr/libexec/PlistBuddy -c 'Print :Name' profile.plist)"
          echo "Team: $(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' profile.plist)"
          echo "App ID: $(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' profile.plist)"

      ##########################################################
      # CocoaPods
      ##########################################################

      - name: Install Pods
        run: |
          cd ios
          pod install --repo-update

      ##########################################################
      # FIX: Force Manual Code Signing in xcconfig
      ##########################################################

      - name: Fix Code Signing Settings
        run: |
          # Append manual signing overrides to casmexRelease.xcconfig
          # This is where the actual build settings come from
          cat >> ios/Flutter/casmexRelease.xcconfig << 'EOF'
          
          // CI/CD Manual Signing Overrides
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY=Apple Distribution: Ajith Ds (CWVH2JB964)
          PROVISIONING_PROFILE_SPECIFIER=match AppStore com.dis.casmex
          DEVELOPMENT_TEAM=CWVH2JB964
          EOF
          
          echo "=== Updated casmexRelease.xcconfig ==="
          cat ios/Flutter/casmexRelease.xcconfig
          
          # Also verify the xcconfig is properly referenced in project
          echo "=== Release-casmex config reference ==="
          grep -A3 "Release-casmex" ios/Runner.xcodeproj/project.pbxproj | head -10

      ##########################################################
      # Build IPA
      ##########################################################

      - name: Build IPA
        run: |
          flutter build ipa \
            --release \
            --flavor casmex \
            -t lib/main_casmex.dart \
            --export-options-plist=ios/ExportOptions.plist \
            --verbose

      ##########################################################
      # Upload Artifact
      ##########################################################

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: casmex-ipa
          path: build/ios/ipa/*.ipa